<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleNursing — Classes prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--blue100:#cce2eb;--blue200:#99c5d7;--blue400:#338caf;--blue:#00709c;--blue600:#00597c;--blue700:#00435d;
--pink100:#fed6e0;--pink:#fc3467;--cerise:#dc2d5a;--cerise6:#b02448;
--yel100:#fef7db;--yel:#fad74f;--yel700:#96812f;
--grn100:#dff5e2;--grn:#62d070;--grn700:#3a7c43;
--n0:#fff;--n075:#f5f5f5;--n100:#ececec;--n200:#d9d9d9;--n300:#c7c7c7;--n600:#818181;--n700:#616161;--n800:#404040;--n900:#202020;
--err:#cb0000;--infosoft:#d2f1f6;
--tx:#202020;--tx2:#616161;--muted:#888;
--page:#f4f4f5;--active:#f0f5f9;
--bd:rgba(0,0,0,.10);--dv:rgba(136,136,136,.30);
--r:8px;--rm:12px;--rl:16px;--rp:9999px;
--sh:0 1px 2px rgba(12,12,13,.05),0 1px 3px rgba(12,12,13,.10);
--shm:0 4px 12px rgba(12,12,13,.08);
--shl:0 12px 32px rgba(11,78,104,.16);
--f:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--fu:"Inter","Open Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--page);color:var(--tx);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--n200);border-radius:9px}

#devbar{position:fixed;bottom:14px;right:14px;z-index:400;font-family:var(--fu);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#devbar .knob{width:26px;height:26px;border-radius:50%;background:rgba(29,26,34,.28);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1;opacity:.5;transition:opacity 140ms,background 140ms}
#devbar .knob:hover{opacity:1;background:#1d1a22}
#devbar .panel{background:#1d1a22;color:#fff;border-radius:var(--rm);box-shadow:0 12px 34px rgba(0,0,0,.35);padding:12px 14px;width:250px}
#devbar .panel b{display:block;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px;color:#9fc7d8;margin-bottom:7px}
#devbar .panel button{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.24);border-radius:6px;padding:5px 10px;color:#fff;font-size:11.5px;margin-bottom:5px}
#devbar .panel button:hover{background:rgba(255,255,255,.14)}
#devbar .panel button.on{background:#fff;color:#1d1a22;border-color:#fff;font-weight:600}
#devbar .panel .foot{border-top:1px solid rgba(255,255,255,.16);margin-top:8px;padding-top:9px;font-size:10.5px;color:#9a97a2}
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--bd);padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:19px;padding:0 18px 15px;letter-spacing:-.01em}
.brand .a{color:var(--blue)}.brand .b{color:var(--pink)}
.sbox{margin:0 16px 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--n200);border-radius:var(--rp);padding:7px 13px;color:var(--muted);font-size:13px}
.ptabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.ptabs div{font-size:11.5px;font-weight:700;letter-spacing:.06em;padding-bottom:9px;color:var(--n600);cursor:pointer}
.ptabs div.on{color:var(--blue);border-bottom:2.5px solid var(--blue)}
.nsec{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--n600);padding:16px 18px 6px}
.nit{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:14px;color:var(--n800);cursor:pointer}
.nit:hover{background:var(--n075)}
.nit.on{background:var(--active);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.nit .ic{width:15px;text-align:center;opacity:.7;font-size:12px}
.nsub{padding:6px 18px 6px 43px;font-size:13px;color:var(--n700);cursor:pointer;display:flex;align-items:center;gap:8px}
.nsub:hover{background:var(--n075)}
.nsub.on{color:var(--blue);font-weight:600;background:var(--active)}
.ndiv{height:1px;background:var(--bd);margin:12px 16px}
.addcls{margin:6px 18px 0;font-size:12.5px;font-weight:700;color:var(--pink);letter-spacing:.03em;cursor:pointer}

.main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1200px}
.crumb{font-size:12px;color:var(--n600);margin-bottom:7px}
.crumb a:hover{color:var(--blue)}
.eb{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
h1{font-size:29px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:700}
.sub{color:var(--tx2);font-size:13.5px}
.muted{color:var(--muted);font-size:13px}
.sm{font-size:12.5px;color:var(--tx2)}

.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px;margin-bottom:18px}
.card.t{padding:16px 18px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.chead h2{display:flex;align-items:center;gap:9px}
.more{font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--rp);font-weight:600;font-size:13.5px;padding:8px 18px;transition:all 140ms cubic-bezier(.4,0,.2,1);white-space:nowrap}
.bo{border:1.4px solid var(--blue);color:var(--blue);background:#fff}.bo:hover{background:var(--active)}
.bp{background:var(--pink);color:#fff}.bp:hover{background:var(--cerise6)}
.bb{background:var(--blue);color:#fff}.bb:hover{background:var(--blue600)}
.bt{color:var(--blue);padding:8px 10px}.bt:hover{background:var(--active)}
.bg{border:1.4px solid var(--n200);color:var(--n700);background:#fff}.bg:hover{background:var(--n075)}
.s{font-size:12.5px;padding:6px 14px}
.lg{font-size:15px;padding:11px 26px}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--rp);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;font-family:var(--fu)}
.cb{background:var(--blue);color:#fff}.cl{background:var(--blue100);color:var(--blue700)}
.cg{background:var(--grn100);color:var(--grn700)}.cy{background:var(--yel100);color:var(--yel700)}
.cp{background:var(--pink100);color:var(--cerise6)}.cn{background:var(--n100);color:var(--n700)}

.bar{height:6px;border-radius:var(--rp);background:var(--n100);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:var(--rp);transition:width 240ms}
.bar.p i{background:var(--pink)}.bar.g i{background:var(--grn)}
.seg{display:flex;gap:4px}
.seg span{height:6px;flex:1;border-radius:var(--rp);background:var(--n100)}
.seg span.d{background:var(--blue)}.seg span.a{background:var(--pink)}

.row{display:flex;gap:16px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.split{display:grid;grid-template-columns:1fr 316px;gap:18px;align-items:start}
@media(max-width:1140px){.split,.g2{grid-template-columns:1fr}}
.btw{display:flex;align-items:center;justify-content:space-between;gap:14px}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:12px}
.hr{height:1px;background:var(--dv);margin:16px 0}

.thumb{border-radius:6px;height:104px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:800;font-size:12.5px;line-height:1.15;text-transform:uppercase;position:relative;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.thumb .dur{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.62);border-radius:3px;font-size:10.5px;padding:1px 5px;font-weight:600;text-transform:none}
.thumb.gd{background:linear-gradient(135deg,#eaf5f9,#cce2eb);color:var(--blue700);text-shadow:none;border:1px solid var(--blue100)}
.thumb.qz{background:linear-gradient(135deg,#00597c,#00343f)}

.lrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--n100)}
.lrow:last-child{border-bottom:none}
.lrow .ico{width:33px;height:33px;flex:0 0 33px;border-radius:6px;background:var(--active);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px}
.lrow .gr{flex:1;min-width:0}
.lrow .t{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{font-size:12.5px;color:var(--tx2)}

.tcard{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:9px;background:#fff;overflow:hidden}
.tcard .lead{padding:14px 18px;border-left:5px solid var(--n200);display:flex;flex-direction:column;gap:2px}
.tcard.ip .lead{border-left-color:var(--blue400);background:#f8fbfd}
.tcard.dn .lead{border-left-color:var(--grn);background:#fbfefc}
.tcard .nm{font-size:15.5px;font-weight:700;cursor:pointer}
.tcard .nm:hover{color:var(--blue)}
.tcard .rt{padding:14px 18px;display:flex;align-items:center;gap:16px}
.steps{display:flex;gap:6px}
.step{border-radius:var(--rp);font-size:10px;font-weight:700;letter-spacing:.07em;padding:5px 12px;font-family:var(--fu);border:1px solid transparent;cursor:pointer}
.step.td{background:#fff;border-color:var(--n200);color:var(--n600)}
.step.td:hover{border-color:var(--blue);color:var(--blue)}
.step.dn{background:var(--blue);color:#fff}
.step.ro{cursor:default}
.step.ro.td:hover{border-color:var(--n200);color:var(--n600)}
.tcard.next{box-shadow:0 0 0 2px var(--blue100)}
.tcard.next .lead{border-left-color:var(--blue);background:var(--active)}

.hero{background:linear-gradient(120deg,#fff,#eef6fa);border:1px solid var(--bd);border-radius:var(--rm);padding:24px 26px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.mike{width:128px;height:96px;border-radius:var(--r);background:linear-gradient(140deg,#2f7fa3,#17516e);flex:0 0 128px;display:flex;align-items:center;justify-content:center;color:#cfe8f2;font-size:10px;font-weight:700;letter-spacing:.09em;font-family:var(--fu)}
.banner{display:flex;align-items:center;gap:12px;background:var(--infosoft);border-radius:var(--r);padding:11px 16px;font-size:13.5px;margin-top:14px}
.banner.w{background:var(--yel100)}
.banner .cta{margin-left:auto;font-weight:700;color:var(--blue);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.empty{text-align:center;padding:34px 20px;color:var(--tx2)}
.empty .bg2{font-size:17px;font-weight:600;color:var(--tx);margin-bottom:6px}
.scr{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.scr>*{flex:0 0 228px}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--n100)}
.kv:last-child{border-bottom:none}
.logrow{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--n100)}
.logrow:last-child{border-bottom:none}
.logrow .d{width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px;flex:0 0 6px}
.logrow .m{color:var(--muted);font-size:11.5px}

.note{display:block;background:#f6f2fd;border:1px dashed #c9bff0;border-radius:var(--r);padding:10px 13px;font-size:12.5px;color:#584a86;margin:10px 0;font-family:var(--fu);line-height:1.45}
.note b{color:#3d3163}
.tier{display:inline-flex;align-items:center;gap:5px;font-family:var(--fu);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6b5ea6;background:#f1eefb;border:1px solid #d8cff5;border-radius:var(--rp);padding:3px 9px}
body.nonotes .note,body.nonotes .tier{display:none}

.scrim{position:fixed;inset:0;background:rgba(20,24,28,.48);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:52px 20px 80px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--rm);box-shadow:var(--shl);width:100%;max-width:640px;padding:26px 28px}
.modal.w{max-width:860px}
.field{margin-top:15px}
.field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--n700);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--n200);border-radius:var(--r);padding:10px 12px;font-size:14.5px}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,112,156,.18)}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--n100)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--n100);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.pick:hover{border-color:var(--blue200);background:#fafcfd}
.pick.sel{border-color:var(--blue);background:var(--active)}
.pick .cbx{width:19px;height:19px;border-radius:4px;border:1.6px solid var(--n300);flex:0 0 19px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.pick.sel .cbx{background:var(--blue);border-color:var(--blue)}
.pick .n{flex:1;font-size:14.5px;font-weight:600}
.picklist{max-height:330px;overflow-y:auto;margin-top:12px;padding-right:4px}

.qopt{border:1.4px solid var(--n200);border-radius:var(--r);padding:12px 15px;margin-bottom:9px;font-size:14.5px;cursor:pointer;display:flex;gap:11px}
.qopt:hover{border-color:var(--blue400);background:#fafcfd}
.qopt.sel{border-color:var(--blue);background:var(--active)}
.qopt.ok{border-color:var(--grn);background:var(--grn100)}
.qopt.no{border-color:var(--err);background:#fdeaea}
.qopt .l{font-weight:700;color:var(--n600);flex:0 0 15px}
.band{border-radius:var(--rm);padding:20px 22px;margin-bottom:16px}
.band.ok{background:var(--grn100);border:1px solid #a0e2a9}
.band.mid{background:var(--yel100);border:1px solid #fbdf72}
.band.low{background:var(--pink100);border:1px solid #fdadc2}
.band h2{font-size:21px}
.wkrow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--n100)}
.wkrow:last-child{border-bottom:none}
.wkrow .nm{flex:0 0 190px;font-size:14px;font-weight:600}
.wkrow .bar{flex:1}
.scpill{background:var(--pink100);color:var(--cerise6);border-radius:var(--rp);font-size:12px;font-weight:700;padding:3px 10px;font-family:var(--fu)}
.scpill.ok{background:var(--grn100);color:var(--grn700)}

.pillbtn{border:1.4px solid var(--n200);color:var(--n700);border-radius:var(--rp);padding:6px 14px;font-size:12.5px;font-weight:600;background:#fff}
.pillbtn:hover{border-color:var(--blue);color:var(--blue)}
.pillbtn.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.searchwrap{margin-top:12px}
.searchin{width:100%;border:1px solid var(--n200);border-radius:var(--rp);padding:9px 16px;font-size:14px}
.searchin:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,112,156,.18)}
.acc{border:1px solid var(--n100);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.acchead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:#fafbfc}
.acchead:hover{background:var(--active)}
.acchead .caret{color:var(--n600);font-size:11px;width:12px}
.acchead .accname{font-weight:700;font-size:14.5px;flex:1}
.accbody{padding:8px 10px 10px;border-top:1px solid var(--n100)}
.accbody .pick{margin-bottom:5px}
.tip{position:relative;display:inline-block}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:0;background:#1d1a22;color:#fff;font-family:var(--fu);font-size:11.5px;line-height:1.4;padding:8px 11px;border-radius:6px;width:230px;opacity:0;pointer-events:none;transition:opacity 140ms;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip:hover::after{opacity:1}
.tip .btn[disabled]{pointer-events:none}

.amenu{position:relative;display:inline-block}
.amenu>.trig{border:1.4px solid var(--blue);border-radius:var(--rp);padding:6px 14px;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:12.5px;font-weight:600;background:#fff;white-space:nowrap}
.amenu>.trig:hover{background:var(--active)}
.amenu>.trig .cv{font-size:9px;opacity:.7}
.backbtn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--n700);border:1px solid var(--n200);border-radius:var(--rp);padding:6px 14px;background:#fff;margin-bottom:12px}
.backbtn:hover{border-color:var(--blue);color:var(--blue);background:var(--active)}
.amenu .pop{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shl);min-width:210px;padding:6px;z-index:120}
.amenu .pop button{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:6px;font-size:13.5px;color:var(--tx)}
.amenu .pop button:hover{background:var(--active);color:var(--blue)}
.amenu .pop button[disabled]{color:var(--n300);cursor:not-allowed;background:none}
.amenu .pop .hint{padding:2px 11px 8px;font-size:11.5px;color:var(--muted);line-height:1.35}
.menuscrim{position:fixed;inset:0;z-index:110}
.selectwrap select{width:100%;border:1px solid var(--n200);border-radius:var(--r);padding:10px 12px;font-size:14.5px;background:#fff}
.selectwrap select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,112,156,.18)}
.explain{background:var(--infosoft);border-radius:var(--r);padding:11px 14px;font-size:13px;margin-top:10px;line-height:1.45}
.explain b{font-weight:700}

.opt{text-transform:none;font-weight:400;color:var(--muted)}
.card.exam{border-top:3px solid var(--blue)}
.examtopics{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.etchip{border:1px solid var(--n200);border-radius:var(--rp);padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--n700);cursor:pointer;background:#fff}
.etchip:hover{border-color:var(--blue);color:var(--blue)}
.etchip.dn{background:var(--grn100);border-color:#a0e2a9;color:var(--grn700)}
.qlab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--n700);margin-bottom:4px}
.sm.warn{color:#8a6100}.sm.ok{color:var(--grn700)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.fchip{border:1.4px solid var(--n200);border-radius:var(--rp);padding:6px 15px;font-size:12.5px;font-weight:600;color:var(--n700);background:#fff}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.lg-bars{display:inline-flex;gap:3px}
.lg-bars i{width:14px;height:5px;border-radius:3px;background:var(--n200);display:block}
.unitlbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--n600);margin:16px 0 7px}
.unitlbl:first-of-type{margin-top:4px}
.unitrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border:1px solid var(--n100);border-radius:var(--r);margin-bottom:7px}
.unitrow .un{font-size:15px;font-weight:700}
.bars{display:inline-flex;gap:4px}
.bars i{width:22px;height:6px;border-radius:3px;background:var(--n200);display:block}
.bars i.on{background:var(--blue)}
.tcard .lead{cursor:pointer}
.chiprow{display:flex;gap:6px;margin-bottom:4px}
.uacc{border-top:1px solid var(--n100);padding:6px 0}

    {id:"mh-sub", n:"Substance use", topics:[

    {id:"mh-comm", n:"Communication", topics:[
      {id:"thpc", n:"Therapeutic communication",v:"Therapeutic Communication",d:"9 min",th:"t",q:8}]}]},

  {id:"ob", name:"Maternity / OB", units:[
    {id:"ob-ante", n:"Antepartum", topics:[
      {id:"pren", n:"Prenatal care",         v:"Prenatal Care",          d:"12 min", th:"p", q:10}]},
    {id:"ob-intra", n:"Intrapartum", topics:[
      {id:"labr", n:"Stages of labor",       v:"Stages of Labor",        d:"14 min", th:"r", q:11},
      {id:"fetl", n:"Fetal monitoring",      v:"Fetal Monitoring",       d:"13 min", th:"b", q:10}]},
    {id:"ob-post", n:"Postpartum", topics:[
      {id:"post", n:"Postpartum complications",v:"Postpartum Complications",d:"11 min",th:"v",q:9}]},
    {id:"ob-newb", n:"Newborn", topics:[
      {id:"newb", n:"Newborn assessment",    v:"Newborn Assessment",     d:"10 min", th:"t", q:9}]}]},

  {id:"peds", name:"Pediatrics", units:[
    {id:"pe-grow", n:"Growth & development", topics:[
      {id:"grow", n:"Growth & development",  v:"Growth & Development",   d:"11 min", th:"g", q:9}]},
    {id:"pe-resp", n:"Peds respiratory", topics:[
      {id:"pres", n:"Pediatric respiratory", v:"Peds Respiratory",       d:"12 min", th:"t", q:10}]},
    {id:"pe-card", n:"Peds cardiac", topics:[
      {id:"chd",  n:"Congenital heart defects",v:"Congenital Heart Defects",d:"13 min",th:"r",q:10}]},
    {id:"pe-endo", n:"Peds endocrine", topics:[
      {id:"dpeds",n:"Diabetes pediatrics",   v:"Diabetes Pediatrics",    d:"10 min", th:"o", q:9}]},
    {id:"pe-hp", n:"Health promotion", topics:[
      {id:"immz", n:"Immunizations",         v:"Immunizations",          d:"8 min",  th:"o", q:8}]}]}
];

/* Library content that isn't folded into a topic. Can only be pinned as an Extra. */
const ORPHANS = [
  {id:"o1", cat:"medsurg", t:"Amputations",                      d:"7 min",  th:"v"},
  {id:"o2", cat:"medsurg", t:"Metabolic & Respiratory ABG",      d:"15 min", th:"b"},
  {id:"o3", cat:"pharm",   t:"Dosage calculation: IV drip rates",d:"12 min", th:"g"},
  {id:"o4", cat:"pharm",   t:"Drug suffixes & mnemonics",        d:"6 min",  th:"o"},
  {id:"o5", cat:"fund",    t:"Lab values cheat run-through",     d:"18 min", th:"n"},
  {id:"o6", cat:"mh",      t:"Test-taking: SATA strategy",       d:"9 min",  th:"p"},
  {id:"o7", cat:"patho",   t:"Nurse Mike's 12 must-know labs",   d:"20 min", th:"b"},
  {id:"o8", cat:"ob",      t:"Newborn reflexes quick review",    d:"5 min",  th:"t"}
];

const ALLTOPICS = {}, ALLUNITS = {};
CATS.forEach(c => c.units.forEach(u => {
  u.cat = c.id; u.catName = c.name; ALLUNITS[u.id] = u;
  u.topics.forEach(t => { t.cat = c.id; t.catName = c.name; t.unit = u.id; t.unitName = u.n; ALLTOPICS[t.id] = t; });
}));
const CAT = id => CATS.find(c => c.id === id);
const catTopics = id => CAT(id).units.reduce((a, u) => a.concat(u.topics), []);

const NAMEMAP = [
  [/med.?surg|medical.?surgical|adult health/i, "medsurg"],
  [/pharm/i, "pharm"],
  [/patho|physiology/i, "patho"],
  [/fundament|foundation|nursing 101|basic/i, "fund"],
  [/mental|psych|behavior/i, "mh"],
  [/matern|ob\b|obstet|women|reproduct/i, "ob"],
  [/peds|pediatric|child/i, "peds"]
];
function guessCat(name) {
  for (const [re, id] of NAMEMAP) if (re.test(name)) return id;
  return null;
}

/* ============================================================
   STATE
   Class > Topic enrollments (loop progress, per class)
         > Items (extras)
         > Exams (planning object -> readiness quiz)
   Mastery is GLOBAL per topic: every answered question counts,
   whatever class or quiz it came from.
   ============================================================ */
var S, R;
var SEQ = 100;
const uid = p => p + (++SEQ);
const TODAY = new Date(2026, 9, 6);
const READY_BAR = 75;
const MIN_PER_TOPIC = 5;

function fmt(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function daysTo(d) { return Math.round((d - S.now) / 864e5); }

function blankState() {
  return {
    now: new Date(TODAY),
    classes: [], enroll: [], items: [], exams: [],
    mastery: {},    // topicId -> {answered, correct, seen:[questionKey]}
    recs: [], watch: [], jump: [], log: [], dismissed: []
  };
}

function addClass(name, o) {
  o = o || {};
  const c = { id: uid("c"), name, cat: o.cat !== undefined ? o.cat : guessCat(name),
    instructor: o.instructor || "", ends: o.ends || null, archived: false, created: o.created || "Aug 26" };
  S.classes.push(c); return c;
}
function enroll(classId, topicId, o) {
  o = o || {};
  const e = { id: uid("e"), classId, topicId, watch: !!o.watch, review: !!o.review, quiz: !!o.quiz, added: o.added || "Sep 2" };
  S.enroll.push(e); return e;
}
function addItem(classId, kind, title, o) {
  o = o || {};
  const i = { id: uid("i"), classId, kind, title, dur: o.dur || "", th: o.th || "b" };
  S.items.push(i); return i;
}
function addExam(classId, name, date, topicIds, o) {
  o = o || {};
  const x = { id: uid("x"), classId, name, date, topicIds: topicIds.slice(),
    qcount: o.qcount || 20, attempts: o.attempts || [], result: o.result || null, past: !!o.past };
  S.exams.push(x); return x;
}
function logIt(classId, topicId, text, when) { S.log.unshift({ classId, topicId, text, when }); }

/* ---- mastery ---- */
function mastery(tid) { return S.mastery[tid] || null; }
function masteryPct(tid) { const m = mastery(tid); return m && m.answered ? Math.round(m.correct / m.answered * 100) : null; }
function recordAnswer(tid, correct, key) {
  const m = S.mastery[tid] || (S.mastery[tid] = { answered: 0, correct: 0, seen: [] });
  m.answered++; if (correct) m.correct++;
  if (key && !m.seen.includes(key)) m.seen.push(key);
}
function seedMastery(tid, answered, correct) { S.mastery[tid] = { answered, correct, seen: [] }; }

/* ---- derived ---- */
const enrollsOf = cid => S.enroll.filter(e => e.classId === cid);
const itemsOf = cid => S.items.filter(i => i.classId === cid);
const examsOf = cid => S.exams.filter(e => e.classId === cid);
const cls = id => S.classes.find(c => c.id === id);
const topicOf = e => ALLTOPICS[e.topicId];
const enrById = id => S.enroll.find(e => e.id === id);
const stepsDone = e => (e.watch ? 1 : 0) + (e.review ? 1 : 0) + (e.quiz ? 1 : 0);
const eDone = e => stepsDone(e) === 3;
const eStarted = e => stepsDone(e) > 0;
const nextExam = cid => examsOf(cid).filter(x => !x.past).sort((a, b) => a.date - b.date)[0] || null;
const lastAttempt = x => x.attempts.length ? x.attempts[x.attempts.length - 1] : null;
function classPct(cid) {
  const es = enrollsOf(cid); if (!es.length) return 0;
  return Math.round(es.reduce((s, e) => s + stepsDone(e), 0) / (es.length * 3) * 100);
}
function tierOf(cid) {
  if (examsOf(cid).length) return 3;
  if (enrollsOf(cid).length) return 2;
  return 1;
}
function upNext(pool) {
  const list = pool.filter(e => !eDone(e));
  return list.filter(eStarted)[0] || list[0] || null;
}

/* ============================================================
   SCENARIOS
   ============================================================ */
function scenario(which) {
  S = blankState(); SEQ = 100;
  R = { view: "home", classId: null, enrollId: null, modal: null, tab: "current", scenario: which,
        filter: "all", hideDone: false };

  if (which === "cold") { S.recs = ["fe", "dka", "ahtn", "acid", "pain", "hf"]; return; }

  const seedResume = () => {
    S.watch = [
      { key: "hf", title: "Heart Failure", th: "r", dur: "14 min", pct: 62, when: "yesterday" },
      { key: "adhd", title: "ADHD/ADD", th: "r", dur: "8 min", pct: 55, when: "2 days ago" },
      { key: "o1", title: "Amputations", th: "v", dur: "7 min", pct: 30, when: "last week" },
      { key: "acid", title: "Acid-Base Balance", th: "b", dur: "18 min", pct: 20, when: "last week" },
      { key: "ins", title: "Insulin", th: "o", dur: "15 min", pct: 80, when: "3 days ago" }
    ];
  };

  if (which === "browse") {
    seedResume();
    addClass("Med Surg I", { instructor: "Prof. J. Whitfield", ends: new Date(2026, 11, 15), created: "Aug 26" });
    addClass("Pharmacology II", { instructor: "Prof. R. Alvarez", ends: new Date(2026, 11, 12), created: "Aug 26" });
    addClass("Mental Health", { created: "Sep 18" });
    return;
  }

  const ms = addClass("Med Surg I", { instructor: "Prof. J. Whitfield", ends: new Date(2026, 11, 15), created: "Aug 26" });
  const ph = addClass("Pharmacology II", { instructor: "Prof. R. Alvarez", ends: new Date(2026, 11, 12), created: "Aug 26" });
  addClass("Mental Health", { created: "Sep 18" });
  seedResume();

  enroll(ph.id, "ahtn", { watch: 1, review: 1, quiz: 1, added: "Sep 2" });
  enroll(ph.id, "ins",  { watch: 1, review: 1, quiz: 1, added: "Sep 2" });
  enroll(ph.id, "card", { watch: 1, added: "Sep 20" });
  enroll(ph.id, "anti", { added: "Sep 20" });
  enroll(ph.id, "cort", { watch: 1, review: 1, added: "Sep 28" });
  seedMastery("ahtn", 22, 15); seedMastery("ins", 18, 17); seedMastery("card", 9, 4);
  addItem(ph.id, "video", "Dosage calculation: IV drip rates", { dur: "12 min", th: "g" });
  addItem(ph.id, "video", "Drug suffixes & mnemonics", { dur: "6 min", th: "o" });
  addItem(ph.id, "guide", "Prof. Alvarez slide deck wk 6");

  enroll(ms.id, "fe",  { watch: 1, review: 1, quiz: 1, added: "Sep 4" });
  enroll(ms.id, "dka", { watch: 1, added: "Sep 29" });
  enroll(ms.id, "hf",  { added: "Oct 1" });
  enroll(ms.id, "aki", { added: "Oct 1" });
  seedMastery("fe", 26, 15); seedMastery("dka", 6, 5);
  addItem(ms.id, "video", "Metabolic & Respiratory ABG", { dur: "15 min", th: "b" });

  logIt(ph.id, "ahtn", "Quiz: Antihypertensives — 68%", "Sep 9");
  logIt(ph.id, "ins", "Quiz: Insulin drugs — 94%", "Sep 14");
  logIt(ms.id, "fe", "Quiz: Fluid & electrolytes — 58%", "Sep 16");
  logIt(ph.id, "card", "Watched Beta Blockers (11 min)", "Oct 4");
  logIt(ms.id, "dka", "Watched DKA vs HHS (14 min)", "Oct 5");

  if (which === "topics") return;

  addExam(ph.id, "Exam 2", new Date(2026, 9, 14), ["card", "anti", "cort"], { qcount: 20 });
  addExam(ph.id, "Exam 1", new Date(2026, 8, 16), ["ahtn", "ins"], {
    past: true, qcount: 15,
    attempts: [{ score: 83, correct: 12, total: 15, fresh: 15, takenOn: "Sep 15",
      perTopic: { ahtn: { c: 5, t: 8 }, ins: { c: 7, t: 7 } } }],
    result: { outcome: "passed", grade: "88" }
  });
  addExam(ms.id, "Exam 2", new Date(2026, 9, 22), ["dka", "hf", "aki"], { qcount: 20 });

  if (which === "postexam") {
    S.enroll.filter(e => e.classId === ph.id && ["card", "anti", "cort"].includes(e.topicId))
      .forEach(e => { e.watch = e.review = e.quiz = true; });
    seedMastery("anti", 14, 9); seedMastery("cort", 11, 8);
    const x = examsOf(ph.id).find(e => e.name === "Exam 2");
    x.attempts = [{ score: 65, correct: 13, total: 20, fresh: 15, takenOn: "Oct 12",
      perTopic: { card: { c: 3, t: 7 }, anti: { c: 5, t: 7 }, cort: { c: 5, t: 6 } } }];
    S.now = new Date(2026, 9, 16);
  }
}
/* ============================================================
   HELPERS + COMPONENTS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bg = k => { const c = TH[k] || TH.b; return `background:linear-gradient(135deg,${c[0]},${c[1]})`; };
const note = () => "";
const tier = () => "";

function actionMenu(id, items, label) {
  const open = R.menu === id;
  return `<div class="amenu">
    <button class="trig" onclick="R.menu=${open ? "null" : `'${id}'`};render()">${esc(label || "Options")}<span class="cv">▾</span></button>
    ${open ? `<div class="pop">${items.map(it => it.hint
      ? `<div class="hint">${it.hint}</div>`
      : `<button ${it.off ? "disabled" : ""} onclick="R.menu=null;${it.off ? "" : it.fn}">${esc(it.label)}</button>`).join("")}</div>` : ""}
  </div>`;
}
function areaBlurb(catId) {
  const c = CAT(catId); if (!c) return "";
  return `<div class="explain">We'll start you in <b>${esc(c.name)}</b>, organised into ${c.units.length} units like ${esc(c.units.slice(0,2).map(u=>u.n).join(" and "))}. Open a unit and pick the topics on your syllabus, or add a whole unit at once. You can pull topics from any other area too.</div>`;
}

function go(view, o) { R = Object.assign(R, { view, modal: null, menu: null }, o || {}); render(); }
function openModal(t, d) { R.menu = null; R.modal = Object.assign({ t }, d || {}); render(); }
function closeModal() { R.modal = null; render(); }

/* ---- live resume state ---- */
const watchedTopic = tid => S.enroll.some(e => e.topicId === tid && e.watch);
const RECS_WARM = [["DKA vs HHS: Priorities", "Video · 14 min"], ["DKA vs HHS", "Study Guide PDF"], ["Endocrine quiz", "10 questions"]];
const watchList = () => S.watch.filter(w => !watchedTopic(w.key));
function jumpRows() {
  const rows = S.enroll
    .filter(e => { const n = stepsDone(e); return n > 0 && n < 3; })
    .map(e => {
      const tp = topicOf(e), c = cls(e.classId);
      const next = !e.watch ? ["Watch " + tp.v, "Video · " + tp.d] : !e.review ? ["Open the " + tp.n + " guide", "Study Guide PDF"] : ["Take the " + tp.n + " quiz", tp.q + " questions"];
      return { ico: !e.watch ? "▶" : !e.review ? "▤" : "?", t: next[0], m: `${c.name} · ${next[1]}`, id: e.id };
    });
  return rows.slice(0, 4);
}

function videoCard(o) {
  const left = o.pct > 0 && o.pct < 100 ? Math.max(1, Math.round((1 - o.pct / 100) * parseInt(o.dur))) + " min left" : o.dur;
  return `<div>
    <div class="thumb" style="${bg(o.th)}">${esc(o.title)}<span class="dur">${esc(o.dur)}</span></div>
    ${o.pct ? `<div class="bar p" style="margin-top:7px"><i style="width:${o.pct}%"></i></div>` : ""}
    <div style="margin-top:7px;font-size:14px;font-weight:600;line-height:1.25">${esc(o.title)}</div>

function classRow(c) {
  const t = tierOf(c.id), es = enrollsOf(c.id), done = es.filter(eDone).length;
  const x = nextExam(c.id), cat = c.cat ? CAT(c.cat) : null;
  const p = classPct(c.id);
  let status, statusCls, right;
  if (t === 1) { status = "NOT SET UP"; statusCls = "cn"; right = `<span class="muted">No topics yet</span>`; }
  else {
    if (x) {
      const d = daysTo(x.date);
      status = d < 0 ? "RESULT NEEDED" : d === 0 ? "EXAM TODAY" : `EXAM IN ${d} DAY${d === 1 ? "" : "S"}`;
      statusCls = d < 0 ? "cy" : "cl";
    } else { status = done === es.length ? "ALL TOPICS DONE" : "IN PROGRESS"; statusCls = done === es.length ? "cg" : "cp"; }
    right = `<div style="min-width:190px"><div class="btw" style="font-size:13px;margin-bottom:5px"><span><b>${done} of ${es.length}</b> topics complete</span><span class="muted">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }
  return `<div class="tcard ${t === 1 ? "" : done === es.length ? "dn" : "ip"}" style="grid-template-columns:260px 1fr auto">
    <div class="lead">
      <span class="chip ${statusCls}" style="align-self:flex-start;margin-bottom:5px">${status}</span>
      <div class="nm" onclick="go('class',{classId:'${c.id}'})">${esc(c.name)}</div>
      <div class="muted">${[c.instructor ? esc(c.instructor) : "", cat ? esc(cat.name) : "no area set", c.ends ? "ends " + fmt(c.ends) : ""].filter(Boolean).join(" · ")}</div>
    </div>
    <div style="padding:14px 8px;display:flex;align-items:center">${right}</div>
    <div class="rt">
      ${x ? `<div style="text-align:right;font-size:12.5px"><div style="font-weight:700">${esc(x.name)}</div><div class="muted">${fmt(x.date)}</div></div>` : ""}
      <button class="btn bo s" onclick="go('class',{classId:'${c.id}'})">${t === 1 ? "Set up class" : "Open class"}</button>
    </div></div>`;
}

/* --- TIER 1 --- */
function tier1(c, cat) {
  if (!cat) return `<div class="card" style="margin-top:18px">
    <div class="chead"><div><h2>What areas does this class cover?</h2><div class="sub">Pick one and this page fills in with the matching videos, guides and quizzes.</div></div></div>
    <div class="selectwrap" style="max-width:380px"><select onchange="setCat('${c.id}',this.value)">
      <option value="">Choose an area</option>
      ${CATS.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}
    </select></div></div>`;

  return `<div class="card" style="margin-top:18px">
    <div class="chead"><div><h2>Start here</h2><div class="sub">Pick the topics you need. Each one gives you a video, a study guide and a quiz, and tracks your progress in this class.</div></div></div>
    ${cat.units.map(u => `<div class="unitrow">
      <div><div class="un">${esc(u.n)}</div><div class="sm">${u.topics.map(x => esc(x.n)).join(" · ")}</div></div>
      <div class="sm">${u.topics.length} topic${u.topics.length === 1 ? "" : "s"}</div>
    </div>`).join("")}
    <div class="btw mt">
      <button class="btn bp s" onclick="openModal('addtopics',{sel:[]})">Pick your topics</button>
      <button class="btn bo s" onclick="addAllCat('${c.id}')">Add all ${catTopics(cat.id).length} ${esc(cat.name)} topics</button>
    </div>
  </div>`;
}

/* --- EXAM: planning object that produces a readiness quiz --- */
function examBlock(c, up, es, past) {
  if (!up) return `<div class="card">
    <div class="chead"><div><h2>Next exam</h2><div class="sub">${past.length ? "Nothing on the calendar right now." : "Nothing set up yet."}</div></div></div>
    <div class="sm" style="margin-bottom:14px">Tell us when your next exam is and what's on it, and we'll build you a readiness quiz that mixes questions from all of those topics.</div>
    <button class="btn bp s" onclick="openModal('addexam',{d:{ids:[],lib:[],qcount:20}})">+ Add your ${past.length ? "next" : "first"} exam</button></div>`;

  const onEx = es.filter(e => up.topicIds.includes(e.topicId));
  const nDone = onEx.filter(eDone).length;
  const d = daysTo(up.date), overdue = d < 0;
  const att = lastAttempt(up);
  const perT = Math.floor(up.qcount / Math.max(1, up.topicIds.length));

  return `<div class="card exam">
    <div class="chead">
      <div><h2>${esc(up.name)} · ${fmt(up.date)}</h2>
        <div class="sub">${overdue ? "Waiting on your result" : d === 0 ? "Today" : `In ${d} day${d === 1 ? "" : "s"}`} · ${up.topicIds.length} topic${up.topicIds.length === 1 ? "" : "s"} · <b>${nDone} of ${onEx.length}</b> studied</div></div>
      ${examMenu(c, up)}
    </div>

    <div class="examtopics">
      ${up.topicIds.map(tid => {
        const e = es.find(z => z.topicId === tid);
        const done = e && eDone(e);
        return `<span class="etchip ${done ? "dn" : ""}" onclick="R.filter='exam';render();scrollTopics()">${done ? "✓ " : ""}${esc(ALLTOPICS[tid].n)}</span>`;
      }).join("")}
      <button class="btn bt s" onclick="openModal('addexam',{d:{id:up.id,name:up.name,ids:up.topicIds.slice(),lib:[],qcount:up.qcount,date:up.date}})">Edit</button>
    </div>

    <div class="hr"></div>

    ${att ? attemptResult(up, att) : `
      <div class="btw" style="align-items:flex-end">
        <div style="flex:1">
          <h3>Readiness quiz</h3>
          <div class="sm" style="margin-top:2px">A mixed quiz across all ${up.topicIds.length} topics on ${esc(up.name)}, so you know where you stand. ${READY_BAR}% or better means you're ready.</div>
          ${qcountNote(up)}
        </div>
        <div style="display:flex;gap:10px;align-items:flex-end">
          <div><label class="qlab">Questions</label>
            <div class="selectwrap"><select onchange="setQCount('${up.id}',this.value)">
              ${[5,10,15,20,25,30,40].map(n => `<option value="${n}" ${up.qcount === n ? "selected" : ""}>${n}</option>`).join("")}
            </select></div></div>
          <button class="btn bp" onclick="startQuiz({kind:'readiness',examId:'${up.id}'})">Start readiness quiz</button>
        </div>
      </div>`}

    ${overdue && !up.result ? `<div class="banner w" style="margin-top:14px"><b>Did you take ${esc(up.name)}?</b> Add your result to close it out and set up your next one.<span class="cta" onclick="openModal('result',{examId:'${up.id}'})">Add result →</span></div>` : ""}
  </div>`;
}

function qcountNote(x) {
  const per = x.qcount / Math.max(1, x.topicIds.length);
  if (!x.topicIds.length) return "";
  if (per >= MIN_PER_TOPIC) return `<div class="sm ok" style="margin-top:6px">${x.qcount} questions across ${x.topicIds.length} topics is about ${Math.floor(per)} each — enough to show you where you're weak.</div>`;
  const need = MIN_PER_TOPIC * x.topicIds.length;
  return `<div class="sm warn" style="margin-top:6px">${x.qcount} questions across ${x.topicIds.length} topics is only ${Math.floor(per)} each. We need ${MIN_PER_TOPIC} per topic to rank your weak spots — try ${need}.</div>`;
}

function examMenu(c, up) {
  const items = [
    { label: "Edit this exam", fn: `openModal('addexam',{d:{id:'${up.id}',name:'${esc(up.name)}',ids:${JSON.stringify(up.topicIds)},lib:[],qcount:${up.qcount},date:new Date('${up.date.toISOString()}')}})` },
    { label: "Add exam result", fn: `openModal('result',{examId:'${up.id}'})` },
    { label: "+ Add an exam", off: true },
    { hint: `Add a result for ${esc(up.name)} and the next one opens up.` }
  ];
  return actionMenu("exam-" + c.id, items, "Exam options");
}

function attemptResult(x, a) {
  const ready = a.score >= READY_BAR;
  const rows = Object.entries(a.perTopic).map(([tid, v]) => ({ tid, ...v, pc: Math.round(v.c / v.t * 100) })).sort((p, q) => p.pc - q.pc);
  return `<div class="band ${ready ? "ok" : "low"}">
    <div class="btw"><div>
      <div class="eb" style="color:inherit;opacity:.7">Readiness quiz · ${esc(a.takenOn)}${x.attempts.length > 1 ? ` · attempt ${x.attempts.length}` : ""}</div>
      <h2 style="margin-top:3px">${ready ? "You're ready" : "Not ready yet"} — ${a.score}%</h2>
      <div class="sm" style="margin-top:3px">${a.correct} of ${a.total} correct. ${READY_BAR}% is the bar.${a.fresh < a.total ? ` ${a.fresh} of these were new questions; we're running low on unseen ones for these topics.` : ""}</div>
    </div>
    <button class="btn bg s" onclick="startQuiz({kind:'readiness',examId:'${x.id}'})">Retake</button></div>
  </div>
  <h3 style="margin-bottom:6px">Where you're weakest</h3>
  <div class="sm" style="margin-bottom:8px">Across the topics on ${esc(x.name)}.</div>
  ${rows.map(r => r.t < MIN_PER_TOPIC
    ? `<div class="wkrow"><div class="nm">${esc(ALLTOPICS[r.tid].n)}</div><div class="sm" style="flex:1">Only ${r.t} question${r.t === 1 ? "" : "s"} on this topic. Not enough to rank — add more questions and retake.</div></div>`
    : `<div class="wkrow"><div class="nm">${esc(ALLTOPICS[r.tid].n)}</div>
       <div class="bar ${r.pc >= READY_BAR ? "g" : "p"}"><i style="width:${r.pc}%"></i></div>
       <span class="scpill ${r.pc >= READY_BAR ? "ok" : ""}">${r.pc}%</span>
       <span class="sm" style="width:104px">${r.c} of ${r.t}</span>
       <button class="btn bo s" onclick="restudy('${x.id}','${r.tid}')">Restudy</button></div>`).join("")}`;
}

function pastExams(past) {
  return `<div class="card t">
    <div class="chead" style="margin-bottom:8px"><h2 style="font-size:16px">Past exams</h2></div>
    ${past.map(x => { const a = lastAttempt(x); return `<div class="lrow" style="padding:10px 0"><div class="gr">
      <div class="t" style="font-size:13.5px">${esc(x.name)} · ${fmt(x.date)}</div>
      <div class="m">${a ? `Scored ${a.score}% on your readiness quiz` : "No readiness quiz taken"}${x.result ? ` · you reported <b>${esc(x.result.grade)}%</b> on the real exam` : " · no result added"}</div>
    </div>${x.result ? `<span class="chip cg">${esc(x.result.outcome)}</span>` : `<button class="btn bo s" onclick="openModal('result',{examId:'${x.id}'})">Add result</button>`}</div>`; }).join("")}
  </div>`;
}

/* --- ONE topic list. Completed topics stay put. --- */
function topicList(c, es, up, nx) {
  const filter = R.filter || "all";
  let list = es.slice();
  if (filter === "exam" && up) list = list.filter(e => up.topicIds.includes(e.topicId));
  if (R.hideDone) list = list.filter(e => !eDone(e));
  const nDone = es.filter(eDone).length;

  const byUnit = {};
  list.forEach(e => { const u = topicOf(e).unit; (byUnit[u] = byUnit[u] || []).push(e); });

  return `<div class="card" id="topics">
    <div class="chead">
      <div><h2>Topics</h2><div class="sub">${nDone} of ${es.length} complete. Watch, read and quiz in whatever order works for you.</div></div>
      ${actionMenu("tb-" + c.id, [
        { label: "Add topics", fn: "openModal('addtopics',{sel:[]})" },
        { label: R.hideDone ? "Show completed topics" : "Hide completed topics", fn: "R.hideDone=!R.hideDone;render()" },
        { label: "Build a quiz from this class", fn: "openModal('classquiz',{sel:[],n:20})" }
      ], "+ Add")}
    </div>

    ${up ? `<div class="filters">
      <button class="fchip ${filter === "all" ? "on" : ""}" onclick="R.filter='all';render()">All topics ${es.length}</button>
      <button class="fchip ${filter === "exam" ? "on" : ""}" onclick="R.filter='exam';render()">On ${esc(up.name)} ${up.topicIds.length}</button>
    </div>` : ""}

    <div class="legend"><span class="lg-bars"><i></i><i></i><i></i></span> video · guide · quiz</div>

    ${Object.keys(byUnit).length
      ? Object.entries(byUnit).map(([uid2, arr]) => `
        <div class="unitlbl">${esc(ALLUNITS[uid2].n)}</div>
        ${arr.map(e => topicCard(e, { isNext: nx && nx.id === e.id, examName: up && up.topicIds.includes(e.topicId) ? up.name : null })).join("")}`).join("")
      : `<div class="sm">Nothing to show with this filter.</div>`}
  </div>`;
}

function nextStepOf(e) {
  const tp = topicOf(e);
  if (!e.watch) return { key: "watch", cta: "Watch video", meta: `${tp.d} video` };

  if (!e.quiz) return { key: "quiz", cta: "Start quiz", meta: `${tp.q} questions` };
  return null;
}

/* ============================================================
   QUIZ ENGINE
   Questions interleave across topics, never blocked.
   Retakes prefer questions the student hasn't seen.
   Every answer writes to global topic mastery.
   ============================================================ */
const STEMS = [
  ["A client is prescribed {T}. Which finding requires immediate follow-up?", ["Blood pressure 138/86", "Heart rate 44 and irregular", "Reports mild headache", "Urine output 45 mL/hr"], 1],
  ["Which statement about {T} indicates the client understands teaching?", ["\"I'll stop as soon as I feel better.\"", "\"I'll double the dose if I miss one.\"", "\"I'll call before taking anything new.\"", "\"I'll skip it on days I feel fine.\""], 2],
  ["The nurse is planning care related to {T}. Which action is the priority?", ["Document the finding", "Assess airway and breathing", "Notify the family", "Reposition the client"], 1],
  ["Which lab result is most concerning for a client with {T}?", ["Potassium 5.9 mEq/L", "Sodium 140 mEq/L", "Hemoglobin 13 g/dL", "Glucose 96 mg/dL"], 0],
  ["A client with {T} reports new symptoms. What should the nurse do first?", ["Administer a PRN medication", "Reassess vital signs", "Chart the complaint", "Call the provider"], 1],
  ["Which client with {T} should the nurse assess first?", ["Ambulating with no complaints", "New onset confusion and low BP", "Asking about discharge teaching", "Requesting a snack"], 1],
  ["The nurse is delegating care for a client with {T}. Which task is appropriate for the UAP?", ["Assessing lung sounds", "Recording intake and output", "Teaching about medications", "Evaluating the care plan"], 1],
  ["A client with {T} is being discharged. Which instruction is most important?", ["Resume all activity immediately", "Report new shortness of breath", "Stop all medications when symptoms ease", "Avoid all fluids after 6pm"], 1]
];
const qKey = (tid, i) => tid + "#" + i;

function buildQuiz(topicIds, n) {
  // Rank stems per topic: unseen first, then least recently used.
  const pools = topicIds.map(tid => {
    const seen = (mastery(tid) || { seen: [] }).seen;
    const idx = STEMS.map((_, i) => i);
    const unseen = idx.filter(i => !seen.includes(qKey(tid, i)));
    const rest = idx.filter(i => seen.includes(qKey(tid, i)));
    return { tid, order: unseen.concat(rest), unseenCount: unseen.length, ptr: 0 };
  });
  const qs = [];
  let guard = 0;
  while (qs.length < n && guard++ < n * 4) {
    const p = pools[qs.length % pools.length];
    const si = p.order[p.ptr % p.order.length]; p.ptr++;
    const s = STEMS[si];
    qs.push({ tid: p.tid, si, key: qKey(p.tid, si), q: s[0].replace("{T}", ALLTOPICS[p.tid].n.toLowerCase()), opts: s[1], a: s[2],
      fresh: p.ptr <= p.unseenCount });
  }
  return qs;
}

function startQuiz(ctx) {
  let topicIds = [], n = 10, title = "", sub = "";
  if (ctx.kind === "topic") {
    const e = enrById(ctx.enrollId); topicIds = [e.topicId]; n = Math.min(8, ALLTOPICS[e.topicId].q);
    title = topicOf(e).n + " quiz"; sub = "Questions on this one topic.";
  } else if (ctx.kind === "readiness") {
    const x = S.exams.find(z => z.id === ctx.examId);
    topicIds = x.topicIds; n = x.qcount;
    title = x.name + " readiness quiz";
    sub = `${n} questions mixed across your ${topicIds.length} exam topics. ${READY_BAR}% or better means you're ready.`;
  } else {
    topicIds = ctx.topicIds; n = ctx.n;
    title = "Quiz · " + cls(ctx.classId).name;
    sub = `${n} questions across ${topicIds.length} topic${topicIds.length === 1 ? "" : "s"} you picked.`;
  }
  R.quiz = { ctx, qs: buildQuiz(topicIds, n), i: 0, ans: [], done: false, title, sub };
  R.modal = null; R.view = "check"; render();
}

function screenCheck() {
  const Q = R.quiz;
  if (!Q) { R.view = "home"; return screenHome(); }
  if (Q.done) return quizResults(Q);
  const q = Q.qs[Q.i], picked = Q.ans[Q.i];
  return `<div class="main" style="max-width:800px">
    <button class="backbtn" onclick="saveExit()">← Save and exit</button>
    <h1>${esc(Q.title)}</h1>
    <div class="sub" style="margin-top:4px">${esc(Q.sub)}</div>
    <div class="card" style="margin-top:16px">
      <div class="btw mb"><div class="eb">Question ${Q.i + 1} of ${Q.qs.length}</div>
        <div class="sm">${esc(ALLTOPICS[q.tid].n)}${q.fresh ? "" : " · seen before"}</div></div>
      <div class="bar mb"><i style="width:${(Q.i + 1) / Q.qs.length * 100}%"></i></div>
      <div style="font-size:16.5px;font-weight:600;margin:14px 0">${esc(q.q)}</div>
      ${q.opts.map((o, i) => `<div class="qopt ${picked === i ? "sel" : ""}" onclick="pick(${i})"><span class="l">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join("")}
      <div class="mfoot">
        ${Q.i > 0 ? `<button class="btn bg" onclick="R.quiz.i--;render()">Back</button>` : ""}
        <button class="btn bp" ${picked === undefined ? "disabled" : ""} onclick="nextQ()">${Q.i === Q.qs.length - 1 ? "Finish" : "Next"}</button>
      </div>
    </div>
  </div>`;
}

function quizResults(Q) {
  const per = {};
  Q.qs.forEach((q, i) => { per[q.tid] = per[q.tid] || { c: 0, t: 0 }; per[q.tid].t++; if (Q.ans[i] === q.a) per[q.tid].c++; });
  const correct = Q.qs.filter((q, i) => Q.ans[i] === q.a).length;
  const score = Math.round(correct / Q.qs.length * 100);
  const fresh = Q.qs.filter(q => q.fresh).length;
  const isReady = Q.ctx.kind === "readiness";
  const ready = score >= READY_BAR;

  if (!Q.saved) {
    Q.saved = true;
    Q.qs.forEach((q, i) => recordAnswer(q.tid, Q.ans[i] === q.a, q.key));
    if (Q.ctx.kind === "topic") {
      const e = enrById(Q.ctx.enrollId); e.quiz = true;
      logIt(e.classId, e.topicId, `Quiz: ${topicOf(e).n} — ${score}%`, "today");
    } else if (isReady) {
      const x = S.exams.find(z => z.id === Q.ctx.examId);
      x.attempts.push({ score, correct, total: Q.qs.length, fresh, takenOn: "today", perTopic: per });
      Object.keys(per).forEach(tid => { const e = S.enroll.find(z => z.classId === x.classId && z.topicId === tid); if (e) e.quiz = true; });
      logIt(x.classId, null, `Readiness quiz: ${x.name} — ${score}%`, "today");
    } else {
      logIt(Q.ctx.classId, null, `Class quiz — ${score}%`, "today");
      Object.keys(per).forEach(tid => { const e = S.enroll.find(z => z.classId === Q.ctx.classId && z.topicId === tid); if (e) e.quiz = true; });
    }
  }

  const back = Q.ctx.kind === "topic" ? `go('topic',{enrollId:'${Q.ctx.enrollId}'})`
    : `go('class',{classId:'${isReady ? S.exams.find(z => z.id === Q.ctx.examId).classId : Q.ctx.classId}'})`;

  return `<div class="main" style="max-width:800px">
    <button class="backbtn" onclick="R.quiz=null;${back}">← Back</button>
    <div class="band ${isReady ? (ready ? "ok" : "low") : score >= READY_BAR ? "ok" : "low"}">
      <div class="eb" style="color:inherit;opacity:.7">${isReady ? "Readiness quiz" : "Quiz result"}</div>
      <h2 style="margin-top:4px">${isReady ? (ready ? "You're ready" : "Not ready yet") : score + "%"} ${isReady ? "— " + score + "%" : ""}</h2>
      <div class="sm" style="margin-top:4px">${correct} of ${Q.qs.length} correct.${isReady ? ` ${READY_BAR}% is the bar.` : ""}${fresh < Q.qs.length ? ` ${fresh} were new to you; the rest you've seen before.` : " Every question was new to you."}</div>
    </div>

    ${Object.keys(per).length > 1 ? `<div class="card">
      <div class="chead"><div><h2>By topic</h2><div class="sub">Where to put your time.</div></div></div>
      ${Object.entries(per).map(([tid, v]) => ({ tid, ...v, pc: Math.round(v.c / v.t * 100) })).sort((a, b) => a.pc - b.pc).map(r =>
        r.t < MIN_PER_TOPIC
        ? `<div class="wkrow"><div class="nm">${esc(ALLTOPICS[r.tid].n)}</div><div class="sm" style="flex:1">Only ${r.t} question${r.t === 1 ? "" : "s"} here. Not enough to rank.</div></div>`
        : `<div class="wkrow"><div class="nm">${esc(ALLTOPICS[r.tid].n)}</div><div class="bar ${r.pc >= READY_BAR ? "g" : "p"}"><i style="width:${r.pc}%"></i></div>
           <span class="scpill ${r.pc >= READY_BAR ? "ok" : ""}">${r.pc}%</span><span class="sm" style="width:96px">${r.c} of ${r.t}</span>
           ${isReady ? `<button class="btn bo s" onclick="R.quiz=null;restudy('${Q.ctx.examId}','${r.tid}')">Restudy</button>` : ""}</div>`).join("")}
    </div>` : ""}

    <div class="card">
      <div class="chead"><div><h2>Review your answers</h2><div class="sub">Every question, with the right answer.</div></div></div>
      ${Q.qs.map((q, i) => {
        const right = Q.ans[i] === q.a;
        return `<div class="lrow" style="align-items:flex-start">
          <div class="ico" style="background:${right ? "var(--grn100)" : "#fdeaea"};color:${right ? "var(--grn700)" : "var(--err)"}">${right ? "✓" : "✕"}</div>
          <div class="gr"><div class="t" style="white-space:normal">${esc(q.q)}</div>
            <div class="m">${esc(ALLTOPICS[q.tid].n)} · ${right ? "correct" : `you picked ${"ABCD"[Q.ans[i]]} · answer is ${"ABCD"[q.a]}, ${esc(q.opts[q.a])}`}</div></div>
          ${right ? "" : `<button class="btn bo s" onclick="toast('Rationale + the video moment that explains it')">See insights</button>`}
        </div>`;
      }).join("")}
    </div>
    <div class="row"><button class="btn bo" onclick="R.quiz=null;${back}">Done</button>
      <button class="btn bg" onclick="startQuiz(R.quiz.ctx)">Retake with new questions</button></div>
  </div>`;
}

function pick(i) { R.quiz.ans[R.quiz.i] = i; render(); }
function nextQ() { if (R.quiz.i === R.quiz.qs.length - 1) R.quiz.done = true; else R.quiz.i++; render(); }
function saveExit() {
  const ctx = R.quiz.ctx; R.quiz = null;
  toast("Saved. Pick it up where you left off.");
  if (ctx.kind === "topic") go("topic", { enrollId: ctx.enrollId });
  else if (ctx.kind === "readiness") go("class", { classId: S.exams.find(z => z.id === ctx.examId).classId });
  else go("class", { classId: ctx.classId });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function doStep(id, k) {
  const e = enrById(id), tp = topicOf(e);
  if (!e[k]) {
    e[k] = true;
    logIt(e.classId, e.topicId, k === "watch" ? "Watched " + tp.v : "Opened the " + tp.n + " guide", "today");
    toast(k === "watch" ? "Video finished. Marked done." : "Guide read. Marked done.");
  } else toast(k === "watch" ? "Playing " + tp.v : "Opening the guide");
  render();
}
function addAllCat(cid) {
  const c = cls(cid); let n = 0;
  catTopics(c.cat).forEach(t => { if (!S.enroll.some(e => e.classId === cid && e.topicId === t.id)) { enroll(cid, t.id, { added: "today" }); n++; } });
  toast(`Added ${n} topic${n === 1 ? "" : "s"}`); render();
}
function addUnit(cid, uid2) {
  const u = ALLUNITS[uid2]; let n = 0;
  u.topics.forEach(t => { if (!S.enroll.some(e => e.classId === cid && e.topicId === t.id)) { enroll(cid, t.id, { added: "today" }); n++; } });
  toast(`Added ${n} ${u.n} topic${n === 1 ? "" : "s"}`); render();
}
function removeEnroll(id) {
  const e = enrById(id), cid = e.classId;
  S.exams.forEach(x => x.topicIds = x.topicIds.filter(t => t !== e.topicId));
  S.enroll = S.enroll.filter(z => z.id !== id);
  go("class", { classId: cid });
}
function setCat(cid, cat) { cls(cid).cat = cat; render(); }
function setQCount(xid, n) { S.exams.find(z => z.id === xid).qcount = parseInt(n); render(); }
function restudy(xid, tid) {
  const x = S.exams.find(z => z.id === xid);
  const e = S.enroll.find(z => z.classId === x.classId && z.topicId === tid);
  if (e) { e.quiz = false; R.enrollId = e.id; }
  logIt(x.classId, tid, `Restudying ${ALLTOPICS[tid].n} after the readiness quiz`, "today");
  if (e) go("topic", { enrollId: e.id }); else go("class", { classId: x.classId });
}
function scrollTopics() { const el = document.getElementById("topics"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
function dismissRec(i) { S.dismissed.push(i); render(); }
let toastT;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#1d1a22;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-family:Inter,sans-serif;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.3)";
    document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = "1";

/* ============================================================

function modalWrap(inner, w) { return `<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal ${w ? "w" : ""}">${inner}</div></div>`; }
const dstr = d => d ? new Date(d).toISOString().slice(0, 10) : "";

/* Class > Unit > Topic browser */
function topicBrowser(o) {
  R.modal.primaryCat = o.primaryCat || null;
  const q = (o.q || "").trim().toLowerCase();
  const cats = o.primaryCat ? [CAT(o.primaryCat)].concat(CATS.filter(c => c.id !== o.primaryCat)) : CATS;
  const body = cats.map(c => {
    const units = c.units.map(u => ({ u, hits: u.topics.filter(t => !q || t.n.toLowerCase().includes(q) || u.n.toLowerCase().includes(q)) }))
      .filter(z => z.hits.length);
    if (!units.length) return "";
    const catOpen = q ? true : (o.open["c:" + c.id] !== undefined ? o.open["c:" + c.id] : c.id === o.primaryCat);
    const nsel = catTopics(c.id).filter(t => o.sel.includes(t.id)).length;
    return `<div class="acc">
      <div class="acchead" onclick="toggleAcc('c:${c.id}')">
        <span class="caret">${catOpen ? "▾" : "▸"}</span><span class="accname">${esc(c.name)}</span>
        <span class="sm">${c.units.length} units · ${catTopics(c.id).length} topics</span>
        ${nsel ? `<span class="chip cl">${nsel} selected</span>` : ""}
        ${(() => { const addable = catTopics(c.id).filter(t => !o.have.includes(t.id) && !o.sel.includes(t.id)).length;
          return `<button class="btn bo s" onclick="event.stopPropagation();selCat('${c.id}','${o.onToggle}')" ${addable ? "" : "disabled"}>${addable ? "Add all " + addable : "All added"}</button>`; })()}
      </div>
      ${catOpen ? `<div class="accbody">${units.map(({ u, hits }) => {
        const uOpen = q ? true : !!o.open["u:" + u.id];
        const allIn = hits.every(t => o.have.includes(t.id) || o.sel.includes(t.id));
        return `<div class="uacc">
          <div class="uhead" onclick="toggleAcc('u:${u.id}')">
            <span class="caret">${uOpen ? "▾" : "▸"}</span><span class="uname">${esc(u.n)}</span>
            <span class="sm">${hits.length} topic${hits.length === 1 ? "" : "s"}${allIn ? " · all added" : ""}</span>
          </div>
          ${uOpen ? hits.map(t => o.have.includes(t.id)
            ? `<div class="pick" style="opacity:.45;cursor:default"><div class="cbx">✓</div><div class="n">${esc(t.n)}</div><div class="sm">already added</div></div>`
            : `<div class="pick ${o.sel.includes(t.id) ? "sel" : ""}" onclick="${o.onToggle}('${t.id}')">
                <div class="cbx">${o.sel.includes(t.id) ? "✓" : ""}</div><div class="n">${esc(t.n)}</div></div>`).join("") : ""}
        </div>`;
      }).join("")}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="searchwrap"><input class="searchin" placeholder="Search units and topics" value="${esc(o.q || "")}" oninput="R.modal.q=this.value;render()"></div>
    <div class="picklist">${body || `<div class="sm" style="padding:14px">Nothing matches "${esc(o.q)}".</div>`}</div>`;
}
function toggleAcc(k) {
  R.modal.open = R.modal.open || {};
  const dflt = k.startsWith("c:") && k.slice(2) === R.modal.primaryCat;
  R.modal.open[k] = !(R.modal.open[k] !== undefined ? R.modal.open[k] : dflt);
  render();
}
function selCat(cid, fn) { catTopics(cid).forEach(t => window[fn](t.id, true)); render(); }

        <input id="f_name" value="${esc(d.name || "")}" placeholder="e.g. Med Surg I"

  let body = "";

  let m = "";
  if (R.modal) {
    const t = R.modal.t;
    if (t === "addclass") m = modalAddClass();
    if (t === "addtopics") m = modalAddTopics();
    if (t === "addexam") m = modalAddExam();
    if (t === "classquiz") m = modalClassQuiz();
    if (t === "result") m = modalResult();
    if (t === "editclass") m = modalEditClass();
    if (t === "additem") m = modalAddItem();
  }
  $("#modalroot").innerHTML = m;
  $("#devbar").innerHTML = devbar();
  const f = document.querySelector("#modalroot input[autofocus]");
  if (f) { const v = f.value; f.focus(); f.setSelectionRange(v.length, v.length); }
}

scenario("exam");
R.view = "home";
render();
</script>
</body>
</html>
