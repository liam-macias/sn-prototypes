/* SimpleNursing — Webfonts
   The brand uses Open Sans (primary UI + headings), Figtree (marketing display),
   Inter (dense UI: toasts, badges, tooltips) and Roboto Mono (code/data).
   Poppins appears on legacy section banners.
   Loaded from Google Fonts. SUBSTITUTION NOTE: the .fig references these by name
   only (no embedded binaries), so we load the Google Fonts versions — visually
   identical for Open Sans / Inter / Figtree / Poppins / Roboto Mono. */

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap');
/* SimpleNursing — Color tokens
   Source of truth: SN - Design system.fig (Primitives + Color collections).
   Primitive ramps first, then semantic aliases used across the product. */

:root {
  /* ── Primary · brand blue (Primary 500 = #00709C) ─────────────── */
  --sn-blue-100: #cce2eb;
  --sn-blue-200: #99c5d7;
  --sn-blue-300: #66a9c3;
  --sn-blue-400: #338caf;
  --sn-blue-500: #00709c;   /* brand primary */
  --sn-blue-600: #00597c;
  --sn-blue-700: #00435d;
  --sn-blue-800: #002c3e;
  --sn-blue-900: #00161f;

  /* ── CTA · pink (CTA 500 = #FC3467) ───────────────────────────── */
  --sn-pink-100: #fed6e0;
  --sn-pink-200: #fdadc2;
  --sn-pink-300: #fd85a3;
  --sn-pink-400: #fc5c85;
  --sn-pink-500: #fc3467;   /* primary CTA */
  --sn-pink-600: #c92952;
  --sn-pink-700: #971f3d;
  /* Cerise — used on solid "Primary" action buttons */
  --sn-cerise-500: #dc2d5a;
  --sn-cerise-600: #b02448;
  --sn-cerise-700: #841b36;

  /* ── Secondary · yellow (#FAD74F) ─────────────────────────────── */
  --sn-yellow-100: #fef7db;
  --sn-yellow-200: #fdefb8;
  --sn-yellow-300: #fce795;
  --sn-yellow-400: #fbdf72;
  --sn-yellow-500: #fad74f;
  --sn-yellow-600: #c8ac3f;
  --sn-yellow-700: #96812f;

  /* ── Tertiary · green (#62D070) ───────────────────────────────── */
  --sn-green-100: #dff5e2;
  --sn-green-200: #c0ecc5;
  --sn-green-300: #a0e2a9;
  --sn-green-400: #81d98c;
  --sn-green-500: #62d070;
  --sn-green-600: #4ea659;
  --sn-green-700: #3a7c43;

  /* ── Quaternary · orange (trial / urgency banners) ────────────── */
  --sn-orange-500: #ff6b00;

  /* ── Neutrals (greyscale ramp) ────────────────────────────────── */
  --sn-neutral-0:   #ffffff;
  --sn-neutral-075: #f5f5f5;
  --sn-neutral-100: #ececec;
  --sn-neutral-200: #d9d9d9;
  --sn-neutral-300: #c7c7c7;
  --sn-neutral-400: #b4b4b4;
  --sn-neutral-500: #a2a2a2;
  --sn-neutral-600: #818181;
  --sn-neutral-700: #616161;
  --sn-neutral-800: #404040;
  --sn-neutral-900: #202020;
  --sn-neutral-950: #000000;
  --sn-ink: #1d1a22;        /* greyscale-100, richest text ink */

  /* ── Functional ───────────────────────────────────────────────── */
  --sn-success: #006d2c;
  --sn-success-soft: #dff5e2;
  --sn-warning: #f9b428;
  --sn-warning-soft: #fef7db;
  --sn-error: #cb0000;
  --sn-error-strong: #d53333;
  --sn-error-soft: #fed6e0;
  --sn-info: #00709c;
  --sn-info-soft: #d2f1f6;

  /* ── Semantic · text ──────────────────────────────────────────── */
  --sn-text-primary: var(--sn-neutral-900);
  --sn-text-secondary: var(--sn-neutral-700);
  --sn-text-muted: #888888;
  --sn-text-inverse: var(--sn-neutral-0);
  --sn-text-link: var(--sn-blue-500);
  --sn-text-cta: var(--sn-pink-500);

  /* ── Semantic · surfaces ──────────────────────────────────────── */
  --sn-surface: var(--sn-neutral-0);
  --sn-surface-subtle: #f7f6f8;
  --sn-surface-page: #f4f4f5;
  --sn-surface-active: #f0f5f9;   /* active nav item bg */
  --sn-surface-inverse: #343538;  /* dark section banner */

  /* ── Semantic · borders & lines ───────────────────────────────── */
  --sn-border: rgba(0, 0, 0, 0.10);
  --sn-border-strong: var(--sn-neutral-200);
  --sn-divider: rgba(136, 136, 136, 0.30);
  --sn-focus-ring: rgba(0, 112, 156, 0.40);
}
/* SimpleNursing — Typography tokens */

:root {
  /* ── Families ─────────────────────────────────────────────────── */
  --sn-font-sans: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sn-font-display: "Figtree", "Open Sans", sans-serif;   /* marketing display */
  --sn-font-ui: "Inter", "Open Sans", sans-serif;          /* dense UI: toasts, badges, tooltips */
  --sn-font-mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* ── Weights ──────────────────────────────────────────────────── */
  --sn-weight-regular: 400;
  --sn-weight-medium: 500;
  --sn-weight-semibold: 600;
  --sn-weight-bold: 700;
  --sn-weight-extrabold: 800;

  /* ── Type scale (px) ──────────────────────────────────────────── */
  --sn-text-2xs: 11px;
  --sn-text-xs: 12px;
  --sn-text-sm: 14px;
  --sn-text-md: 16px;
  --sn-text-lg: 20px;
  --sn-text-xl: 24px;
  --sn-text-2xl: 28px;
  --sn-text-3xl: 32px;
  --sn-text-4xl: 40px;
  --sn-text-5xl: 48px;
  --sn-text-6xl: 64px;

  /* ── Line heights ─────────────────────────────────────────────── */
  --sn-leading-tight: 1.1;
  --sn-leading-snug: 1.25;
  --sn-leading-normal: 1.5;
  --sn-leading-relaxed: 1.6;
}

/* ── Semantic type roles (apply as classes where useful) ─────────── */
.sn-display {
  font-family: var(--sn-font-display);
  font-weight: var(--sn-weight-semibold);
  font-size: var(--sn-text-4xl);
  line-height: var(--sn-leading-tight);
  letter-spacing: -0.01em;
  color: var(--sn-text-primary);
}
.sn-h1 {
  font-family: var(--sn-font-sans);
  font-weight: var(--sn-weight-bold);
  font-size: var(--sn-text-3xl);
  line-height: var(--sn-leading-snug);
  color: var(--sn-text-primary);
}
.sn-h2 {
  font-family: var(--sn-font-sans);
  font-weight: var(--sn-weight-semibold);
  font-size: var(--sn-text-xl);
  line-height: var(--sn-leading-snug);
  color: var(--sn-text-primary);
}
.sn-body {
  font-family: var(--sn-font-sans);
  font-weight: var(--sn-weight-regular);
  font-size: var(--sn-text-md);
  line-height: var(--sn-leading-normal);
  color: var(--sn-text-secondary);
}
.sn-label {
  font-family: var(--sn-font-sans);
  font-weight: var(--sn-weight-semibold);
  font-size: var(--sn-text-xs);
  line-height: var(--sn-leading-tight);
  letter-spacing: 0.02em;
  color: var(--sn-text-primary);
}
.sn-eyebrow {
  font-family: var(--sn-font-sans);
  font-weight: var(--sn-weight-bold);
  font-size: var(--sn-text-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sn-text-link);
}
/* SimpleNursing — Spacing, radii, shadows, motion */

:root {
  /* ── Spacing scale ────────────────────────────────────────────── */
  --sn-space-1: 4px;
  --sn-space-2: 8px;
  --sn-space-3: 12px;
  --sn-space-4: 16px;
  --sn-space-5: 20px;
  --sn-space-6: 24px;
  --sn-space-8: 32px;
  --sn-space-12: 48px;
  --sn-space-16: 64px;

  /* ── Radii ────────────────────────────────────────────────────── */
  --sn-radius-sm: 8px;     /* cards, inputs, nav items */
  --sn-radius-md: 12px;
  --sn-radius-lg: 16px;    /* badges, soft containers */
  --sn-radius-xl: 24px;    /* hero / section banners */
  --sn-radius-pill: 9999px;/* buttons, chips */

  /* ── Borders ──────────────────────────────────────────────────── */
  --sn-stroke: 1px;
  --sn-stroke-bold: 1.4px;

  /* ── Shadows ──────────────────────────────────────────────────── */
  --sn-shadow-xs: 0 1px 4px rgba(25, 33, 61, 0.06);              /* badges */
  --sn-shadow-sm: 0 1px 2px rgba(12, 12, 13, 0.05), 0 1px 3px rgba(12, 12, 13, 0.10);
  --sn-shadow-md: 0 4px 12px rgba(12, 12, 13, 0.08);             /* cards, popovers */
  --sn-shadow-lg: 0 12px 32px rgba(11, 78, 104, 0.16);          /* dialogs, raised */
  --sn-shadow-focus: 0 0 0 3px var(--sn-focus-ring);

  /* ── Motion ───────────────────────────────────────────────────── */
  --sn-ease: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --sn-duration-fast: 120ms; /* @kind other */
  --sn-duration: 180ms; /* @kind other */
  --sn-duration-slow: 260ms; /* @kind other */
}

<script type="text/babel" data-presets="react">
/* ===================== Learning Loops — app.jsx ===================== */
const NS = window.SimpleNursingDesignSystem_349937;
const { Button, Card, StatBlock, SegmentedControl, Banner, Badge, Chip, SideNav, Link, Logo, Icon } = NS;
const { useState, useMemo } = React;
const DATA = window.LL_DATA;

/* ---------- progress helpers ---------- */
function topicParts(t){ const p=[['v',true],['g',true],['q',t.quizQ>0]].filter(x=>x[1]).map(x=>x[0]); return p; }
function topicProgress(done, exam, i){
  const t=DATA[exam].topics[i]; const parts=topicParts(t);
  const got=parts.filter(k=>done[`${exam}:${i}:${k}`]).length;
  return {got,total:parts.length,complete: got===parts.length && parts.length>0};
}
function examStats(done, exam){
  const topics=DATA[exam].topics;
  let tc=0,vd=0,gd=0,qd=0,qq=0,vm=0;
  topics.forEach((t,i)=>{
    if(done[`${exam}:${i}:v`]){vd++; vm+=t.videoMin||0;}
    if(done[`${exam}:${i}:g`])gd++;
    if(t.quizQ>0 && done[`${exam}:${i}:q`]){qd++; qq+=t.quizQ;}
    if(topicProgress(done,exam,i).complete)tc++;
  });
  return {tc,total:topics.length,pct:Math.round(tc/topics.length*100),vd,gd,qd,qq,vm:Math.round(vm)};
}
function nextAction(done, exam){
  const topics=DATA[exam].topics;
  for(let i=0;i<topics.length;i++){
    const t=topics[i];
    if(!done[`${exam}:${i}:v`]) return {i,kind:'v',label:`Watch: ${t.video}`,topic:t.topic};
    if(!done[`${exam}:${i}:g`]) return {i,kind:'g',label:`Review guide: ${t.guide}`,topic:t.topic};
    if(t.quizQ>0 && !done[`${exam}:${i}:q`]) return {i,kind:'q',label:`Take quiz: ${t.topic} (${t.quizQ} Q)`,topic:t.topic};
  }
  return null;
}
const kindLabel=k=>k==='v'?'Video':k==='g'?'Study guide':'Quiz';

/* ---------- small UI atoms ---------- */
function Eyebrow({children,color}){
  return <p style={{font:'600 12px/1.2 var(--sn-font-sans)',letterSpacing:'.06em',textTransform:'uppercase',color:color||'var(--sn-text-muted)',margin:0}}>{children}</p>;
}
function Ring({pct,size=104}){
  const r=52, c=2*Math.PI*r, off=c*(1-pct/100);
  return (
    <div style={{position:'relative',width:size,height:size}}>
      <svg width={size} height={size} viewBox="0 0 120 120">
        <circle cx="60" cy="60" r={r} fill="none" strokeWidth="11" stroke="var(--sn-neutral-100)"/>
        <circle cx="60" cy="60" r={r} fill="none" strokeWidth="11" stroke="var(--sn-blue-500)"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
          transform="rotate(-90 60 60)" style={{transition:'stroke-dashoffset .7s var(--sn-ease)'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <span style={{font:'700 24px var(--sn-font-sans)',color:'var(--sn-text-primary)'}}>{pct}%</span>
        <span style={{font:'400 11px var(--sn-font-sans)',color:'var(--sn-text-muted)',marginTop:-2}}>complete</span>
      </div>
    </div>
  );
}

/* ---------- THE LOOP SPINE (signature) ---------- */
function LoopSpine({pct}){
  const steps=['Plan','Learn','Practice','Ready','Test'];
  const activeIdx = pct>=100?3 : pct>0?1 : 0;
  return (
    <Card padding={24}>
      <Eyebrow>The loop · where you are</Eyebrow>
      <div style={{position:'relative',paddingLeft:4,marginTop:16}}>
        <div style={{position:'absolute',left:14,top:10,bottom:10,width:2,background:'var(--sn-neutral-100)'}}/>
        {steps.map((s,i)=>{
          const st=i<activeIdx?'done':i===activeIdx?'active':'todo';
          const border=st==='done'?'var(--sn-blue-500)':st==='active'?'var(--sn-pink-500)':'var(--sn-neutral-200)';
          const txt=st==='active'?'var(--sn-text-primary)':st==='done'?'var(--sn-blue-600)':'var(--sn-text-muted)';
          return (
            <div key={s} style={{position:'relative',display:'flex',alignItems:'center',gap:12,padding:'10px 0',zIndex:1}}>
              <span style={{width:28,height:28,borderRadius:'50%',border:`2px solid ${border}`,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {st==='done'
                  ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-10" stroke="var(--sn-blue-500)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  : st==='active'
                    ? <span style={{width:10,height:10,borderRadius:'50%',background:'var(--sn-pink-500)'}}/>
                    : <span style={{width:8,height:8,borderRadius:'50%',background:'var(--sn-neutral-200)'}}/>}
              </span>
              <span style={{font:`${st==='active'?600:500} 14px var(--sn-font-sans)`,color:txt}}>{s}</span>
              {st==='active' && <span style={{marginLeft:'auto'}}><Chip tone="red">you're here</Chip></span>}
            </div>
          );
        })}
      </div>
      <p style={{font:'400 12px/1.5 var(--sn-font-sans)',color:'var(--sn-text-muted)',marginTop:16}}>
        Phase 1 covers <b style={{color:'var(--sn-blue-600)'}}>Plan → Learn → Practice</b>. Ready, Test &amp; Remediate come next.
      </p>
    </Card>
  );
}

/* ---------- DASHBOARD ---------- */
function Dashboard({done, exam, onGo, onToggle, onNewExam}){
  const meta = exam && DATA[exam];
  const s = exam && examStats(done, exam);
  const next = exam && nextAction(done, exam);

  const greet = (
    <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:24}}>
      <div>
        <Eyebrow>Tuesday · Your dashboard</Eyebrow>
        <h1 style={{font:'700 32px var(--sn-font-sans)',color:'var(--sn-text-primary)',margin:'6px 0 0'}}>Hi Debbie</h1>
      </div>
    </div>
  );

  if(!exam){
    return (
      <div>
        {greet}
        <Card padding={40} style={{textAlign:'center'}}>
          <div style={{maxWidth:460,margin:'0 auto'}}>
            <div style={{width:56,height:56,margin:'0 auto 16px',borderRadius:16,background:'var(--sn-info-soft)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5v14" stroke="var(--sn-blue-500)" strokeWidth="2.4" strokeLinecap="round"/></svg>
            </div>
            <h2 style={{font:'700 24px var(--sn-font-sans)',margin:'0 0 8px',color:'var(--sn-text-primary)'}}>No active study plan</h2>
            <p style={{font:'400 16px/1.6 var(--sn-font-sans)',color:'var(--sn-text-secondary)',margin:'0 0 24px'}}>
              You've got 1,300+ videos, 900+ study guides, and thousands of practice questions. Tell us your exam, and we'll turn it into a plan — so you're not deciding what to study, just studying.
            </p>
            <Button color="pink" size="lg" uppercase onClick={()=>onGo('entry')}>Set up your exam</Button>
          </div>
        </Card>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:16}}>
          {[['1,363','Videos'],['943','Study guides'],['8,000+','Practice questions']].map(([n,l])=>(
            <div key={l} style={{background:'#fff',border:'1px dashed var(--sn-border-strong)',borderRadius:8,padding:16,textAlign:'center'}}>
              <p style={{font:'700 20px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:0}}>{n}</p>
              <p style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'2px 0 0'}}>{l}</p>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // daily tasks (first 3 incomplete)
  const tasks=[];
  meta.topics.forEach((t,i)=>{
    if(!done[`${exam}:${i}:v`]) tasks.push({i,kind:'v',topic:t.topic,label:t.video,meta:t.videoMin?`${t.videoMin} min`:''});
    if(!done[`${exam}:${i}:g`]) tasks.push({i,kind:'g',topic:t.topic,label:t.guide,meta:''});
    if(t.quizQ>0 && !done[`${exam}:${i}:q`]) tasks.push({i,kind:'q',topic:t.topic,label:`${t.topic} quiz`,meta:`${t.quizQ} Q`});
  });
  const daily=tasks.slice(0,3);

  return (
    <div>
      {greet}
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:24,alignItems:'start'}} className="ll-grid">
        {/* plan card */}
        <Card accent="blue" padding={24}>
          <div style={{display:'flex',justifyContent:'space-between',gap:16,flexWrap:'wrap',alignItems:'flex-start'}}>
            <div>
              <Eyebrow color="var(--sn-blue-600)">Active plan</Eyebrow>
              <h2 style={{font:'700 24px var(--sn-font-sans)',margin:'6px 0 0',color:'var(--sn-text-primary)'}}>{meta.examName}</h2>
              <p style={{font:'400 13px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'4px 0 0'}}>{meta.course} · exam in 12 days · {s.total} topics</p>
            </div>
            <Ring pct={s.pct}/>
          </div>

          <div style={{marginTop:20,padding:16,borderRadius:12,background:'var(--sn-info-soft)'}}>
            <Eyebrow color="var(--sn-blue-600)">Your next step</Eyebrow>
            <div style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap',alignItems:'center',marginTop:6}}>
              <div>
                <p style={{font:'600 16px var(--sn-font-sans)',color:'var(--sn-blue-700)',margin:0}}>{next?next.label:'You\'ve finished every topic'}</p>
                <p style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-blue-600)',margin:'2px 0 0',opacity:.85}}>{next?`in ${next.topic}`:'Take the final checkpoint for your readiness score'}</p>
              </div>
              <Button color={next?'blue':'pink'} size="sm" onClick={()=>onGo('plan')}>{next?'Continue':'Final checkpoint'}</Button>
            </div>
          </div>

          <div style={{marginTop:20}}>
            <Eyebrow>Today's plan · ~35 min</Eyebrow>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:8}}>
              {daily.length===0 && <p style={{font:'400 14px var(--sn-font-sans)',color:'var(--sn-green-700)',margin:0}}>All caught up for today. Nice work.</p>}
              {daily.map((t,k)=>(
                <button key={k} onClick={()=>onToggle(exam,t.i,t.kind,true)}
                  style={{display:'flex',alignItems:'center',gap:12,padding:12,borderRadius:8,border:'1px solid var(--sn-border)',background:'#fff',textAlign:'left',cursor:'pointer',transition:'background var(--sn-duration)'}}
                  onMouseOver={e=>e.currentTarget.style.background='var(--sn-surface-subtle)'}
                  onMouseOut={e=>e.currentTarget.style.background='#fff'}>
                  <span style={{width:20,height:20,borderRadius:6,border:'1px solid var(--sn-border-strong)',flexShrink:0}}/>
                  <span style={{flex:1,minWidth:0}}>
                    <span style={{display:'block',font:'600 14px var(--sn-font-sans)',color:'var(--sn-text-primary)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.label}</span>
                    <span style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)'}}>{t.topic} · {kindLabel(t.kind)}{t.meta?` · ${t.meta}`:''}</span>
                  </span>
                  <span style={{font:'500 11px var(--sn-font-mono)',color:'var(--sn-text-muted)'}}>mark done</span>
                </button>
              ))}
            </div>
          </div>
        </Card>

        <LoopSpine pct={s.pct}/>
      </div>

      {/* stats */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'32px 0 12px'}}>

      </div>

                <div key={i} style={{display:'flex',alignItems:'center',gap:12}}>
                  <span style={{font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-secondary)',width:180,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.topic}</span>
                  <span style={{flex:1,height:10,borderRadius:9999,overflow:'hidden',background:'var(--sn-surface-page)'}}>
                    <span style={{display:'block',height:'100%',borderRadius:9999,width:`${pc}%`,background:col,transition:'width .6s var(--sn-ease)'}}/>
                  </span>
                  <span style={{font:'500 11px var(--sn-font-mono)',color:'var(--sn-text-muted)',width:38,textAlign:'right'}}>{pc}%</span>
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ---------- EXAM ENTRY ---------- */
function ExamEntry({onGo, onGenerate}){
  const [mode,setMode]=useState('Type it out');
  const [name,setName]=useState(''); const [topics,setTopics]=useState(''); const [date,setDate]=useState('');
  const [exam,setExam]=useState(null);

  function fill(k){
    const names={cardiac:'Med-Surg Exam 2 — Cardiac', pharm:'Pharmacology Final'};
    const tp={cardiac:'cardiac patho, atherosclerosis & CAD, angina, MI, heart failure, hypertension, cardiomyopathy, endocarditis, pericarditis, cardiac tamponade, EKG rhythms, valve disorders, dysrhythmias',
      pharm:'pharmacokinetics, antihypertensives, beta blockers, ACE inhibitors & ARBs, diuretics, heparin & warfarin, blood thinners, diabetic drugs, steroids, antibiotics, antidepressants, analgesics'};
    setName(names[k]); setTopics(tp[k]); setDate('in 12 days'); setExam(k);
  }
  function detect(txt){
    txt=(txt||'').toLowerCase();
    const ph=['pharma','drug','beta block','ace inhib','warfarin','heparin','antibiotic','antidepress','diuretic','steroid','insulin'].filter(w=>txt.includes(w)).length;
    const ca=['cardiac','heart','mi ','myocard','angina','hypertension','ekg','ecg','tamponade','cardiomyo','pericard','endocard','atheroscler'].filter(w=>txt.includes(w)).length;
    if(ph===0&&ca===0) return null; return ph>ca?'pharm':'cardiac';
  }
  function build(){
    const ex = exam || detect(topics||name);
    if(!ex) return;
    onGenerate(ex, name||DATA[ex].examName);
  }

  return (
    <div style={{maxWidth:640,margin:'0 auto'}}>
      <button onClick={()=>onGo('dashboard')} style={{background:'none',border:'none',cursor:'pointer',font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-muted)',padding:0,marginBottom:20}}>← Back</button>
      <Eyebrow color="var(--sn-blue-600)">Plan · Exam entry</Eyebrow>
      <h1 style={{font:'700 32px var(--sn-font-sans)',margin:'6px 0 4px',color:'var(--sn-text-primary)'}}>What are you studying for?</h1>
      <p style={{font:'400 16px/1.6 var(--sn-font-sans)',color:'var(--sn-text-secondary)',margin:'0 0 24px'}}>Tell us the exam. We'll build the plan from SimpleNursing's real videos, guides, and quizzes.</p>

      <div style={{marginBottom:24}}>
        <SegmentedControl options={['Type it out','Pick from my course']} value={mode} onChange={setMode}/>
      </div>

      <Card padding={24}>
        {mode==='Type it out' ? (
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <Field label="Exam name">
              <Input value={name} onChange={setName} placeholder="e.g. Med-Surg Exam 2 — Cardiac"/>
            </Field>
            <Field label="Topics or learning objectives" hint="We'll match these to SN content and flag anything we don't cover yet.">
              <textarea value={topics} onChange={e=>{setTopics(e.target.value); setExam(null);}} rows={4}
                placeholder="Paste from your syllabus, or list what's on the exam — e.g. heart failure, MI, hypertension, EKG rhythms, cardiomyopathy, endocarditis…"
                style={inputStyle({area:true})}/>
            </Field>
            <Field label="Exam date">
              <Input value={date} onChange={setDate} placeholder="in 12 days"/>
            </Field>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <span style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)'}}>Try:</span>
              <button onClick={()=>fill('cardiac')} style={chipBtn()}>Cardiac exam</button>
              <button onClick={()=>fill('pharm')} style={chipBtn()}>Pharmacology exam</button>
            </div>
            <Button color="pink" size="lg" fullWidth uppercase onClick={build}>Build my plan</Button>
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <p style={{font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-secondary)',margin:0}}>Exams detected from your enrolled course:</p>
            {[['cardiac',DATA.cardiac],['pharm',DATA.pharm]].map(([k,d])=>(
              <button key={k} onClick={()=>onGenerate(k, d.examName)}
                style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:16,padding:16,borderRadius:8,border:'1px solid var(--sn-border)',background:'#fff',textAlign:'left',cursor:'pointer'}}
                onMouseOver={e=>e.currentTarget.style.background='var(--sn-surface-subtle)'}
                onMouseOut={e=>e.currentTarget.style.background='#fff'}>
                <span>
                  <span style={{display:'block',font:'600 16px var(--sn-font-sans)',color:'var(--sn-text-primary)'}}>{d.examName}</span>
                  <span style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)'}}>{d.course} · {d.topics.length} topics · final checkpoint {d.finalQuizQ} Q</span>
                </span>
                <Chip tone="blue">Select</Chip>
              </button>
            ))}
            <p style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'4px 0 0'}}>In the real product, these come from course enrollment or a syllabus upload.</p>
          </div>
        )}
      </Card>
    </div>
  );
}
function Field({label,hint,children}){
  return (<div><label style={{display:'block',font:'600 14px var(--sn-font-sans)',color:'var(--sn-text-primary)',marginBottom:6}}>{label}</label>{children}{hint&&<p style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'6px 0 0'}}>{hint}</p>}</div>);
}
const inputStyle=({area}={})=>({width:'100%',padding:'12px 16px',borderRadius:8,border:'1px solid var(--sn-border-strong)',font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-primary)',outline:'none',resize:area?'none':undefined,boxSizing:'border-box'});
function Input({value,onChange,placeholder}){return <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={inputStyle()}/>;}
const chipBtn=()=>({font:'400 12px var(--sn-font-sans)',padding:'6px 12px',borderRadius:9999,border:'1px solid var(--sn-border-strong)',background:'#fff',cursor:'pointer',color:'var(--sn-text-secondary)'});

/* ---------- GENERATING ---------- */
function Generating(){
  const msgs=['Matching topics to SimpleNursing content','Sequencing videos, guides & quizzes','Checking quiz coverage per topic','Flagging gaps in coverage'];
  const [mi,setMi]=useState(0);
  React.useEffect(()=>{const iv=setInterval(()=>setMi(m=>Math.min(m+1,msgs.length-1)),520);return()=>clearInterval(iv);},[]);
  return (
    <div style={{maxWidth:420,margin:'80px auto',textAlign:'center'}}>
      <div className="ll-spin" style={{width:48,height:48,margin:'0 auto 20px',borderRadius:'50%',border:'3px solid var(--sn-blue-500)',borderTopColor:'transparent'}}/>
      <p style={{font:'700 20px var(--sn-font-sans)',margin:'0 0 4px',color:'var(--sn-text-primary)'}}>Building your plan…</p>
      <p style={{font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:0}}>{msgs[mi]}</p>
    </div>
  );
}

/* ---------- PLAN VIEW ---------- */
function PlanView({done, exam, userName, onGo, onToggle}){
  const meta=DATA[exam]; const s=examStats(done,exam);
  const [open,setOpen]=useState(()=>{ const n=nextAction(done,exam); return n?n.i:0; });
  const [readiness,setReadiness]=useState(null);
  const allDone = s.tc===s.total;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      <button onClick={()=>onGo('dashboard')} style={{background:'none',border:'none',cursor:'pointer',font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-muted)',padding:0,alignSelf:'flex-start'}}>← Dashboard</button>
      <div>
        <Eyebrow color="var(--sn-blue-600)">Learn · Your plan</Eyebrow>
        <h1 style={{font:'700 32px var(--sn-font-sans)',margin:'6px 0 0',color:'var(--sn-text-primary)'}}>{userName||meta.examName}</h1>
        <p style={{font:'400 14px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'4px 0 0'}}>{meta.topics.length} topics · {s.pct}% complete · click items to mark them done</p>
      </div>

      {meta.gaps && meta.gaps.length>0 &&
        <Banner tone="warning" onClose={null}>
          <span><b>Coverage check.</b> {meta.gaps.map((g,i)=><span key={i}>{i>0?' · ':' '}{g}</span>)}</span>
        </Banner>}

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {meta.topics.map((t,i)=><TopicRow key={i} done={done} exam={exam} i={i} t={t} open={open===i} onOpen={()=>setOpen(open===i?-1:i)} onToggle={onToggle}/>)}
      </div>

      <Card accent={allDone?'pink':'none'} padding={24} style={allDone?{}:{borderColor:'var(--sn-border)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,borderRadius:12,flexShrink:0,background:allDone?'var(--sn-pink-100)':'var(--sn-surface-page)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke={allDone?'var(--sn-pink-500)':'var(--sn-neutral-500)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div>
              <p style={{font:'600 16px var(--sn-font-sans)',margin:0,color:'var(--sn-text-primary)',display:'flex',alignItems:'center',gap:8}}>Final checkpoint <Badge tone="neutral">Ready · Phase 1 preview</Badge></p>
              <p style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'2px 0 0'}}>Full-scope {meta.finalQuiz} quiz ({meta.finalQuizQ} Q) → returns a readiness score</p>
            </div>
          </div>
          <Button color="pink" disabled={!allDone} onClick={()=>setReadiness(78+Math.floor(Math.random()*14))}>{allDone?'Take checkpoint':'Finish all topics first'}</Button>
        </div>
        {readiness!==null &&
          <div style={{marginTop:20,paddingTop:20,borderTop:'1px solid var(--sn-border)',display:'flex',alignItems:'center',gap:16}}>
            <div style={{font:'700 40px var(--sn-font-sans)',color:'var(--sn-green-600)'}}>{readiness}%</div>
            <div><p style={{font:'600 16px var(--sn-font-sans)',margin:0,color:'var(--sn-text-primary)'}}>Likely ready</p>
            <p style={{font:'400 12px/1.5 var(--sn-font-sans)',color:'var(--sn-text-muted)',margin:'2px 0 0'}}>Based on topic mastery + checkpoint performance. In Phase 1 this is the readiness signal that closes the Learn loop.</p></div>
          </div>}
      </Card>
    </div>
  );
}

function TopicRow({done, exam, i, t, open, onOpen, onToggle}){
  const p=topicProgress(done,exam,i);
  const items=[
    ['v','Video',t.video,t.videoMin?`${t.videoMin} min`:'',true],
    ['g','Study guide',t.guide,'',true],
    ['q','Quiz',`${t.topic} quiz`,t.quizQ>0?`${t.quizQ} questions`:'no quiz yet',t.quizQ>0],
  ];
  return (
    <Card padding={0} style={{overflow:'hidden'}}>
      <button onClick={onOpen} style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:16,background:'none',border:'none',textAlign:'left',cursor:'pointer'}}>
        <span style={{font:'500 12px var(--sn-font-mono)',color:'var(--sn-text-muted)',width:24,flexShrink:0}}>{String(i+1).padStart(2,'0')}</span>
        <span style={{width:28,height:28,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',background:p.complete?'var(--sn-green-100)':'var(--sn-surface-page)'}}>
          {p.complete
            ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-10" stroke="var(--sn-green-600)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>
            : <span style={{font:'500 10px var(--sn-font-mono)',color:'var(--sn-text-muted)'}}>{p.got}/{p.total}</span>}
        </span>
        <span style={{flex:1,minWidth:0}}>
          <span style={{display:'block',font:'600 16px var(--sn-font-sans)',color:'var(--sn-text-primary)'}}>{t.topic}</span>
          <span style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)'}}>{p.complete?'Complete':`video → guide${t.quizQ>0?' → quiz':''}`}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style={{flexShrink:0,transition:'transform var(--sn-duration)',transform:open?'rotate(180deg)':'none'}}><path d="M6 9l6 6 6-6" stroke="var(--sn-neutral-500)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>
      {open &&
        <div style={{padding:'0 16px 16px',display:'flex',flexDirection:'column',gap:8}}>
          {items.map(([kind,typ,label,meta,active])=>{
            const isDone=!!done[`${exam}:${i}:${kind}`];
            const stroke=kind==='v'?(isDone?'var(--sn-green-600)':'var(--sn-pink-500)'):kind==='g'?(isDone?'var(--sn-green-600)':'var(--sn-blue-500)'):(isDone?'var(--sn-green-600)':'var(--sn-yellow-600)');
            return (
              <div key={kind} style={{display:'flex',alignItems:'center',gap:12,padding:12,borderRadius:8,background:'var(--sn-surface-page)'}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  {kind==='v'?<path d="M8 5v14l11-7z" fill={stroke}/>:kind==='g'?<path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke={stroke} strokeWidth="2"/>:<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke={stroke} strokeWidth="2" strokeLinecap="round"/>}
                </svg>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{display:'block',font:'600 14px var(--sn-font-sans)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:isDone?'var(--sn-text-muted)':'var(--sn-text-primary)',textDecoration:isDone?'line-through':'none'}}>{label}</span>
                  <span style={{font:'400 12px var(--sn-font-sans)',color:'var(--sn-text-muted)'}}>{typ}{meta?` · ${meta}`:''}</span>
                </span>
                {active
                  ? (isDone
                      ? <Chip tone="green" leftIcon={<span>✓</span>}>Done</Chip>
                      : <button onClick={()=>onToggle(exam,i,kind,true)} style={{font:'600 12px var(--sn-font-sans)',padding:'6px 14px',borderRadius:9999,border:'1px solid var(--sn-border-strong)',background:'#fff',color:'var(--sn-text-secondary)',cursor:'pointer'}}>{kind==='v'?'Watch':kind==='g'?'Open':'Start'}</button>)
                  : <Badge tone="neutral">soon</Badge>}
              </div>
            );
          })}
        </div>}
    </Card>
  );
}

/* ---------- APP SHELL ---------- */
function App(){
  const [view,setView]=useState('dashboard');
  const [activeExam,setActiveExam]=useState('cardiac');
  const [userName,setUserName]=useState(null);
  const [done,setDone]=useState(()=>{
    const d={}; [0,1,2,3].forEach(i=>['v','g','q'].forEach(k=>{ if(!(k==='q'&&DATA.cardiac.topics[i].quizQ===0)) d[`cardiac:${i}:${k}`]=true; })); d['cardiac:4:v']=true; return d;
  });

  function toggle(exam,i,kind,val){ setDone(prev=>{const n={...prev}; if(val)n[`${exam}:${i}:${kind}`]=true; else delete n[`${exam}:${i}:${kind}`]; return n;}); }
  function generate(exam,name){
    setView('generating');
    setTimeout(()=>{ setActiveExam(exam); setUserName(name); setView('plan'); }, 2100);
  }
  function reset(){ setView('dashboard'); setActiveExam(null); setUserName(null); setDone({}); }

  const sections=[
    { items:[{key:'home',label:'Learning Loops',icon:'home'},{key:'collections',label:'My collections',icon:'collections'},{key:'favourites',label:'Favourites',icon:'star'}] },
    { header:'LEARN', items:[{key:'video',label:'Video lessons',icon:'video'},{key:'pdfs',label:'Study Guide PDFs',icon:'doc'},{key:'webinars',label:'Nursing Webinars',icon:'webinar'}] },
    { header:'PRACTICE', items:[{key:'qbank',label:'Question Bank',icon:'bank'},{key:'readiness',label:'Readiness',icon:'assessment'}] },
    { divider:true, items:[{key:'settings',label:'Settings',icon:'settings'}] },
  ];

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div className="ll-sidebar">
        <SideNav sections={sections} active="home" onSelect={()=>{}} cta={<span>Upgrade now</span>} onCta={()=>{}}/>
      </div>
      <div style={{flex:1,overflowY:'auto'}}>
        <div style={{maxWidth:1040,margin:'0 auto',padding:'24px 24px 64px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
            <Badge tone="blue">Learning Loops · Prototype</Badge>
            <button onClick={reset} style={{font:'500 12px var(--sn-font-sans)',padding:'6px 12px',borderRadius:8,border:'1px solid var(--sn-border-strong)',background:'#fff',color:'var(--sn-text-secondary)',cursor:'pointer'}}>Reset demo</button>
          </div>
          {view==='dashboard' && <Dashboard done={done} exam={activeExam} onGo={setView} onToggle={toggle} onNewExam={()=>setView('entry')}/>}
          {view==='entry' && <ExamEntry onGo={setView} onGenerate={generate}/>}
          {view==='generating' && <Generating/>}
          {view==='plan' && <PlanView done={done} exam={activeExam} userName={userName} onGo={setView} onToggle={toggle}/>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
